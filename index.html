<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UndoTable</title>
  <meta name="description" content="Undo for the stuff you take apart. Snap a photo after each step; UndoTable shows where every loose part came from.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <button class="brand" data-go="home" aria-label="UndoTable home"><span class="logo" aria-hidden="true">↶</span> UndoTable</button>
    <nav class="tabs" aria-label="Views">
      <button data-go="record">Record</button>
      <button data-go="back">Put it back</button>
      <button data-go="parts">Parts</button>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="busy" class="busy" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet"></dialog>
  <input id="shoot" type="file" accept="image/*" capture="environment" hidden>
  <input id="seek" type="file" accept="image/*" capture="environment" hidden>
  <script type="module" src="src/app.js"></script>
</body>
</html>
